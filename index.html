<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1613" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<title>ApexCut</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F3EE; --surface:#FFFFFF; --sunk:#E5E9E2;
  --ink:#15302A; --ink2:rgba(21,48,42,.74); --ink3:rgba(21,48,42,.52); --line:rgba(21,48,42,.12);
  --accent:#D99512; --accent-soft:rgba(217,149,18,.16); --on-accent:#2B1D00;
  --leaf:#2F6B4F; --chili:#B8402B;
  --shadow:0 1px 2px rgba(21,48,42,.05),0 10px 28px rgba(21,48,42,.07);
  --font:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0D1613; --surface:#15211C; --sunk:#1D2B25;
    --ink:#E6EDE8; --ink2:rgba(230,237,232,.76); --ink3:rgba(230,237,232,.5); --line:rgba(230,237,232,.12);
    --accent:#F0B43A; --accent-soft:rgba(240,180,58,.18); --on-accent:#2B1D00;
    --leaf:#74B592; --chili:#E37A62;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--font);
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px)}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{max-width:520px;margin:0 auto;padding:0 16px calc(112px + env(safe-area-inset-bottom,0px))}

/* Header */
.top{display:flex;align-items:center;gap:8px;padding:16px 0 8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.top .when{flex:1;min-width:0}
.top h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.top p{margin:0;font-size:13px;color:var(--ink3)}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--ink2)}
.iconbtn:active{background:var(--sunk)}
.iconbtn[disabled]{opacity:.3;pointer-events:none}
.sync{width:44px;height:44px;display:grid;place-items:center}
.sync i{width:10px;height:10px;border-radius:50%;background:var(--ink3)}
.sync[data-s="ok"] i{background:var(--leaf)}
.sync[data-s="busy"] i{background:var(--accent);animation:pulse 1s infinite}
.sync[data-s="wait"] i{background:var(--accent)}
.sync[data-s="err"] i{background:var(--chili)}
@keyframes pulse{50%{opacity:.35}}

/* Dial */
.dial{display:grid;place-items:center;padding:8px 0 0}
.dial svg{width:min(300px,82vw);height:auto;overflow:visible}
.dial .track{stroke:var(--sunk)}
.dial .prog{stroke:var(--accent);transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1)}
.dial .clock{stroke:var(--line)}
.dial .tick{stroke:var(--ink3)}
.dial .hr{fill:var(--ink3);font-size:11px;font-family:var(--font)}
.dial .ev{stroke-width:2.5;transition:fill .3s,stroke .3s}
.dial .ev.todo{fill:var(--bg);stroke:var(--ink3)}
.dial .ev.done{fill:var(--accent);stroke:var(--accent)}
.dial .ev.missed{fill:var(--bg);stroke:var(--chili)}
.dial .now{fill:var(--ink)}
.dial .big{fill:var(--ink);font:700 56px var(--font);letter-spacing:-.03em}
.dial .unit{fill:var(--ink3);font:500 13px var(--font)}
.dial.complete .prog{animation:glow 1.6s ease-out 1}
@keyframes glow{0%{filter:drop-shadow(0 0 0 var(--accent))}40%{filter:drop-shadow(0 0 10px var(--accent))}100%{filter:none}}

/* Next up */
.next{display:flex;align-items:center;gap:16px;margin:8px 0 24px;padding:16px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}
.next .txt{flex:1;min-width:0}
.next .k{font-size:13px;color:var(--ink3)}
.next .v{font-weight:700}
.next .s{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:500;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

/* Metrics */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:32px}
.panel{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.water{grid-column:1/-1}
.mk{font-size:13px;color:var(--ink3)}
.mv{font-size:22px;font-weight:700;letter-spacing:-.01em}
.mv small{font-size:13px;font-weight:500;color:var(--ink3)}
.bar{height:8px;border-radius:8px;background:var(--sunk);overflow:hidden;margin:12px 0}
.bar b{display:block;height:100%;background:var(--accent);border-radius:8px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.waterrow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.waterrow .mv{white-space:nowrap}
.chips{display:flex;gap:8px}
.chip{min-width:44px;min-height:44px;padding:0 14px;border-radius:999px;background:var(--sunk);font-weight:500}
.chip.on{background:var(--ink);color:var(--bg)}
.chip:active{transform:scale(.95)}
.tap{display:block;text-align:left;width:100%}

/* Section headings */
h2{font-size:13px;font-weight:500;color:var(--ink3);margin:0 0 8px;letter-spacing:.01em}
.sec{margin-bottom:32px}

/* Timeline */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:64px 1fr 48px;align-items:start;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.tl li:last-child{border-bottom:0}
.tl .t{font-size:13px;color:var(--ink3);padding-top:2px}
.tl .body{text-align:left;min-height:44px}
.tl .title{display:block;font-weight:500}
.tl .sub{display:block;font-size:13px;color:var(--ink3)}
.tl .detail{display:none;font-size:13px;color:var(--ink2);margin-top:8px}
.tl li.open .detail{display:block}
.tl li.done .title{color:var(--ink2)}
.tl li.missed .t{color:var(--chili)}
.check{width:44px;height:44px;display:grid;place-items:center;justify-self:end}
.check span{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink3);display:grid;place-items:center;transition:background .2s,border-color .2s,transform .2s}
.check svg{opacity:0;transform:scale(.6);transition:opacity .2s,transform .2s}
.check[aria-pressed="true"] span{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.check[aria-pressed="true"] svg{opacity:1;transform:none}
.check.pop span{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.22)}}
.link{color:var(--leaf);font-weight:500}

/* Forms */
.field{display:block;margin-bottom:16px}
.field span{display:block;font-size:13px;color:var(--ink3);margin-bottom:4px}
.input{width:100%;min-height:48px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
textarea.input{padding:12px 14px;min-height:88px;resize:vertical}
.input:focus{outline:none;border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Train */
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 0 16px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days .chip{flex:0 0 auto}
.ex{border-bottom:1px solid var(--line)}
.ex-head{display:grid;grid-template-columns:1fr auto;gap:4px 12px;width:100%;text-align:left;padding:16px 0;min-height:64px}
.ex-name{font-weight:500}
.ex-meta,.ex-last{font-size:13px;color:var(--ink3);grid-column:1}
.ex-count{grid-row:1/span 3;grid-column:2;align-self:center;font-size:13px;color:var(--ink3);min-width:40px;text-align:right}
.ex-count.full{color:var(--leaf);font-weight:700}
.sets{display:none;padding:0 0 16px}
.ex.open .sets{display:block}
.set{display:grid;grid-template-columns:40px 1fr 1fr 48px;gap:8px;align-items:center;margin-bottom:8px}
.set .n{font-size:13px;color:var(--ink3)}
.set .input{min-height:44px;text-align:center}
.set.logged .input{background:var(--accent-soft);border-color:transparent}
.unit-row{display:grid;grid-template-columns:40px 1fr 1fr 48px;gap:8px;font-size:13px;color:var(--ink3);margin-bottom:4px;text-align:center}
.note{font-size:13px;color:var(--ink3);margin:0 0 12px}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(488px,calc(100% - 32px));
  background:var(--ink);color:var(--bg);border-radius:20px;padding:12px 16px;display:none;align-items:center;gap:12px;z-index:20}
.timer.on{display:flex}
.timer .tv{font-size:22px;font-weight:700;min-width:72px}
.timer .tl2{flex:1;font-size:13px;opacity:.8}
.timer button{min-height:40px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.14);color:inherit;font-size:13px}
@media (prefers-color-scheme:dark){.timer button{background:rgba(0,0,0,.12)}}

/* Progress */
.hero-num{display:flex;align-items:baseline;gap:8px;margin:8px 0 4px}
.hero-num b{font-size:56px;line-height:1;font-weight:700;letter-spacing:-.03em}
.hero-num span{color:var(--ink3)}
.chart svg{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line)}
.chart .lbl{fill:var(--ink3);font-size:11px;font-family:var(--font)}
.chart .band{fill:var(--accent-soft)}
.chart .goal{stroke:var(--leaf);stroke-dasharray:4 4}
.chart .pt{fill:var(--ink3)}
.chart .avg{stroke:var(--ink);fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.heat i{aspect-ratio:1;border-radius:8px;background:var(--sunk);position:relative}
.heat i b{position:absolute;inset:0;border-radius:8px;background:var(--accent)}
.heat i.today{outline:2px solid var(--ink);outline-offset:1px}
.heat i.future{background:transparent;border:1px dashed var(--line)}
.heatlbl{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:11px;color:var(--ink3);text-align:center;margin-bottom:6px}
table.wk{width:100%;border-collapse:collapse;font-size:13px}
table.wk th{color:var(--ink3);font-weight:500;text-align:right;padding:8px 0}
table.wk th:first-child,table.wk td:first-child{text-align:left}
table.wk td{text-align:right;padding:8px 0;border-top:1px solid var(--line)}

/* Plan */
.list{list-style:none;margin:0;padding:0}
.list li{display:grid;grid-template-columns:64px 1fr auto;gap:8px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.list li:last-child{border-bottom:0}
.list .t{font-size:13px;color:var(--ink3);padding-top:1px}
.list .r{font-size:13px;color:var(--ink3);text-align:right}
.list .d{display:block;font-size:13px;color:var(--ink3)}
.rules{margin:0;padding-left:20px;color:var(--ink2);font-size:15px}
.rules li{margin-bottom:8px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:15px;padding:8px 0}
.kv span:first-child{color:var(--ink3)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all}
.banner{display:flex;gap:12px;align-items:center;padding:16px;border-radius:20px;background:var(--accent-soft);margin-bottom:24px}
.banner p{margin:0;flex:1;font-size:15px}

/* Nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:520px}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;justify-content:center;font-size:12px;color:var(--ink3);border-radius:14px}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:500}
nav.tabs button[aria-current="page"] .pill{background:var(--accent-soft)}
nav.tabs .pill{width:56px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background .2s}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,16,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:24px 24px 0 0;
  padding:12px 16px calc(24px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet{visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 16px}
.sheet h3{margin:0 0 16px;font-size:22px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:50;
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:15px;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{padding:24px 0;color:var(--ink3);font-size:15px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="iconbtn" data-a="prevDay" aria-label="Previous day"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="when"><h1 id="hTitle">Today</h1><p id="hSub"></p></div>
    <button class="iconbtn" data-a="nextDay" aria-label="Next day"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg></button>
    <button class="sync" id="sync" data-a="go" data-v="plan" aria-label="Sync status"><i></i></button>
  </header>
  <main id="view"></main>
</div>

<div class="timer" id="timer" role="timer" aria-live="polite">
  <div class="tv" id="tv">0:00</div><div class="tl2" id="tl2">Rest</div>
  <button data-a="timerAdd">+15 s</button><button data-a="timerStop">Skip</button>
</div>

<nav class="tabs"><div class="in">
  <button data-a="go" data-v="today"><span class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2" stroke-linecap="round"/></svg></span>Today</button>
  <button data-a="go" data-v="train"><span class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg></span>Train</button>
  <button data-a="go" data-v="progress"><span class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M5 15l4-4 4 3 6-7"/></svg></span>Progress</button>
  <button data-a="go" data-v="plan"><span class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></span>Plan</button>
</div></nav>

<div class="scrim" id="scrim" data-a="closeSheet"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast" role="status"></div>

  ].map(r => ({ day: r[0], split: r[1], name: r[2], sets: r[3], reps: r[4], rest: r[5], notes: r[6] })),
  reminders: [
    ['r01','07:00','All','Gut and skin primer'],['r02','07:15','All','Morning mobility'],['r03','08:30','All','Breakfast'],
    ['r04','10:00','All','Water check'],['r05','11:30','All','Majjiga time'],['r06','13:30','All','Lunch'],
    ['r07','15:30','All','Water check'],['r08','17:15','All','Pre-workout fuel'],['r09','18:25','Weekdays','Gym time'],
    ['r10','17:00','Weekends','Recovery walk'],['r11','20:05','Weekdays','Post-workout protein'],['r12','18:15','Weekends','Protein top-up'],
    ['r13','20:45','All','Dinner'],['r14','22:00','All','Daily wrap-up']
  ].map(r => ({ id: r[0], time: r[1], days: r[2], title: r[3], enabled: true }))
};
const BOOLS = ['primer','breakfast','majjiga','lunch','preworkout','shake','dinner','creatine','mobility','workout','cardio'];

/* ---------------- State ---------------- */
const S = load() || {};
S.cfg = S.cfg || { url: '', token: '' };
S.plan = S.plan || DEFAULT_PLAN;

S.sets = S.sets || [];
S.weekly = S.weekly || [];

let UI = { view: 'today', date: todayStr(), open: {}, openEx: null, trainDay: null, drafts: {}, status: 'idle', error: '' };

function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }

  try { localStorage.setItem(KEY, JSON.stringify({ cfg: S.cfg, plan: S.plan, days: S.days, sets: S.sets, weekly: S.weekly, queue: S.queue, lastSync: S.lastSync })); }
  catch (e) { toast('Storage is full. Sync to free up space.'); }
}

/* ---------------- Dates ---------------- */
function pad(n) { return String(n).padStart(2, '0'); }
function fmt(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function todayStr() { return fmt(new Date()); }
function parse(s) { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }

function diffDays(a, b) { return Math.round((parse(a) - parse(b)) / 86400000); }
function dow(s) { return parse(s).getDay(); }
function isWeekend(s) { const d = dow(s); return d === 0 || d === 6; }
function toMin(hm) { const m = String(hm).match(/(\d{1,2}):(\d{2})/); return m ? +m[1] * 60 + +m[2] : 0; }

function t12(hm) { const m = toMin(hm); let h = Math.floor(m / 60), mm = m % 60; const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + pad(mm) + ' ' + ap; }
function startDate() { return String(S.plan.settings.START_DATE || todayStr()).slice(0, 10); }
function dayNum(s) { return diffDays(s, startDate()) + 1; }
function weekNum(s) { return Math.floor((dayNum(s) - 1) / 7) + 1; }

/* ---------------- Day model ---------------- */
function set_() { return S.plan.settings; }
function blankDay(date) { const d = { date, water: 0, weight: null, extraProtein: null, extraCalories: null, steps: null, sleep: null, energy: null, notes: '' }; BOOLS.forEach(k => d[k] = false); return d; }
function day(date) { return S.days[date] || blankDay(date); }
function calc(d) {
  let protein = 0, kcal = 0;
  S.plan.meals.forEach(m => { if (d[m.id]) { protein += +m.protein || 0; kcal += +m.kcal || 0; } });
  protein += +d.extraProtein || 0; kcal += +d.extraCalories || 0;
  const s = set_();
  const done = BOOLS.filter(k => d[k]).length + ((d.water || 0) >= +s.WATER_TARGET ? 1 : 0) + (protein >= +s.PROTEIN_TARGET ? 1 : 0);
  return { protein, kcal, score: done / 13 };
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function enqueue(op) { op.id = uid(); S.queue.push(op); save(); scheduleFlush(); }

function setField(date, field, value) {
  const before = calc(day(date)).score;
  const d = Object.assign({}, day(date)); d[field] = value; S.days[date] = d;

}
function addWater(date, ml) {

}
function afterChange(before, date) {

    const dial = document.querySelector('.dial');
    if (dial) { dial.classList.remove('complete'); void dial.offsetWidth; dial.classList.add('complete'); }

  }
}
function buzz(p) { try { navigator.vibrate && navigator.vibrate(p || 12); } catch (e) {} }

/* ---------------- Timeline for a day ---------------- */
function timeline(date) {
  const s = set_(), we = isWeekend(date), meals = S.plan.meals;
  const m = id => meals.find(x => x.id === id) || { time: '12:00', name: id, items: '', protein: 0 };
  const pre = m('preworkout');
  const items = meals.map(x => ({ id: x.id, time: (we && x.id === 'shake') ? '18:15' : x.time, title: x.name, sub: x.protein + ' g protein', detail: x.items }));
  items.push({ id: 'mobility', time: '07:15', title: 'Morning mobility', sub: '10 min, bodyweight', detail: mobility().map(w => w.name + ' (' + (w.sets > 1 ? w.sets + ' × ' : '') + w.reps + ')').join(', ') });
  items.push({ id: 'creatine', time: pre.time, title: 'Creatine', sub: (s.CREATINE_G || 5) + ' g with carbs', detail: 'One level scoop. No loading phase. Water weight may add 1 to 2 kg in weeks 1 to 3.' });
  if (we) {
    items.push({ id: 'workout', time: '17:00', title: 'Recovery walk', sub: '45 to 60 min brisk', detail: 'Aim for ' + (+s.STEP_GOAL || 10000).toLocaleString('en-IN') + ' steps today.' });
    items.push({ id: 'cardio', time: '18:00', title: 'Stretch and foam roll', sub: '15 min', detail: 'Static stretching for hips, hamstrings, chest and upper back.' });
  } else {
    const split = splitName(date);
    items.push({ id: 'workout', time: '18:30', title: split, sub: 'Gym, 6:30 to 8:00 PM', detail: 'Open Train to log your sets.', link: 'train' });
    const c = S.plan.workouts.find(w => w.split === 'Cardio');
    items.push({ id: 'cardio', time: '19:45', title: c ? c.name : 'Incline walk', sub: c ? c.reps : '15 min', detail: c ? c.notes : '' });
  }
  return items.sort((a, b) => toMin(a.time) - toMin(b.time));
}
function mobility() { return S.plan.workouts.filter(w => w.day === 'Daily'); }
function gymFor(date) { const k = DOW[dow(date)]; return S.plan.workouts.filter(w => w.day === k); }
function splitName(date) { const g = gymFor(date); return g.length ? g[0].split : 'Rest day'; }
function itemState(it, d, date) {

}

/* ---------------- Rendering ---------------- */
const $ = s => document.querySelector(s);
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const ICON_CHECK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function render() {

  document.querySelector('[data-a="nextDay"]').disabled = date >= t;

function dialSVG(d, items, date, score) {
  const C = 150, R = 132, r = 104, circ = 2 * Math.PI * r;
  const START = 6 * 60, SPAN = 18 * 60;
  const ang = m => (-90 + ((m - START) / SPAN) * 360) * Math.PI / 180;
  const pos = (m, rad) => [C + rad * Math.cos(ang(m)), C + rad * Math.sin(ang(m))];
  let g = '<circle class="clock" cx="150" cy="150" r="' + R + '" fill="none" stroke-width="1.5"/>';
  [6, 9, 12, 15, 18, 21].forEach(h => {
    const [x1, y1] = pos(h * 60, R - 6), [x2, y2] = pos(h * 60, R + 6), [lx, ly] = pos(h * 60, R + 20);
    g += '<line class="tick" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke-width="1.5"/>';
    g += '<text class="hr" x="' + lx + '" y="' + (ly + 4) + '" text-anchor="middle">' + ((h % 12) || 12) + (h < 12 ? 'a' : 'p') + '</text>';

  items.forEach(it => {
    const [x, y] = pos(toMin(it.time), R);
    g += '<circle class="ev ' + itemState(it, d, date) + '" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="6"><title>' + esc(t12(it.time) + ' ' + it.title) + '</title></circle>';
  });
  if (date === todayStr()) {
    const m = Math.max(START, Math.min(START + SPAN - 1, nowMin()));
    const a = ang(m), [x, y] = pos(m, R - 14);
    const p1 = [x + 7 * Math.cos(a), y + 7 * Math.sin(a)], p2 = [x - 3 * Math.cos(a) + 5 * Math.cos(a + Math.PI / 2), y - 3 * Math.sin(a) + 5 * Math.sin(a + Math.PI / 2)], p3 = [x - 3 * Math.cos(a) - 5 * Math.cos(a + Math.PI / 2), y - 3 * Math.sin(a) - 5 * Math.sin(a + Math.PI / 2)];

  }

  g += '<text class="unit" x="150" y="186" text-anchor="middle">% of today done</text>';
  return '<svg viewBox="-10 -10 320 320" role="img" aria-label="' + Math.round(score * 100) + ' percent of today done">' + g + '</svg>';
}

function nextUp(items, d, date) {
  const open = items.filter(i => !d[i.id]);

function statCard(k, v) { return '<div class="panel"><div class="mk">' + k + '</div><div class="mv">' + v + '</div></div>'; }
function weightChart(weighed) {

  let g = '';

  g += '<rect class="band" x="' + x(sd) + '" y="' + Tp + '" width="' + (x(addDays(sd, 21)) - x(sd)) + '" height="' + (H - Tp - B) + '"/>';

let flushTimer = null, flushing = false, backoff = 2000;

async function api(action, extra) {
  if (!S.cfg.url) throw new Error('Connect your Sheet first.');
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 30000);
  try {
    const res = await fetch(S.cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ token: S.cfg.token, action }, extra || {})), redirect: 'follow', signal: ctl.signal });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'The Sheet returned an error.');
    return j.data;
  } catch (err) {
    if (err.name === 'AbortError') throw new Error('The Sheet took too long to answer.');
    if (err instanceof SyntaxError || err.message === 'Failed to fetch') throw new Error(navigator.onLine ? 'Could not reach the Sheet. Check the URL and that the web app is deployed for Anyone.' : 'You are offline. Changes are saved on this phone.');

}

  const batch = S.queue.slice(0, 40);
  try {
    const r = await api('sync', { ops: batch });
    const done = new Set(r.done);
    S.queue = S.queue.filter(o => !done.has(o.id));
    Object.keys(r.days || {}).forEach(dt => { if (!S.queue.some(o => o.date === dt)) S.days[dt] = mergeServerDay(r.days[dt]); });
    S.lastSync = Date.now(); UI.status = 'ok'; UI.error = ''; backoff = 2000; save();
    if (S.queue.length) setTimeout(flush, 100);
    else if (UI.view !== 'train' || !document.activeElement || document.activeElement.tagName !== 'INPUT') render();
  } catch (err) {
    UI.status = 'err'; UI.error = err.message; scheduleFlush(backoff); backoff = Math.min(backoff * 2, 60000);
  } finally { flushing = false; paintSync(); }
}
function mergeServerDay(sd) {
  const d = blankDay(sd.date);
  ['water', 'weight', 'extraProtein', 'extraCalories', 'steps', 'sleep', 'energy', 'notes'].concat(BOOLS).forEach(k => { if (sd[k] !== undefined) d[k] = sd[k]; });
  return d;
}
let lastBoot = 0;
async function bootstrap(loud) {
  if (!S.cfg.url) return;
  lastBoot = Date.now(); UI.status = 'busy'; paintSync();
  try {
    await flush();
    const r = await api('bootstrap');
    S.plan = { sheetUrl: r.sheetUrl, settings: Object.assign({}, DEFAULT_PLAN.settings, r.settings),
      meals: r.meals.length ? r.meals : DEFAULT_PLAN.meals, workouts: r.workouts.length ? r.workouts : DEFAULT_PLAN.workouts, reminders: r.reminders.length ? r.reminders : DEFAULT_PLAN.reminders };
    const pendingDates = new Set(S.queue.filter(o => o.type === 'day').map(o => o.date));
    r.days.forEach(sd => { if (!pendingDates.has(sd.date)) S.days[sd.date] = mergeServerDay(sd); });
    const delPending = new Set(S.queue.filter(o => o.type === 'deleteSet').map(o => o.setId));
    const addPending = S.queue.filter(o => o.type === 'set').map(o => ({ setId: o.setId, date: o.date, split: o.split, exercise: o.exercise, setNo: o.setNo, weight: o.weight, reps: o.reps }));
    const serverIds = new Set(r.sets.map(s => s.setId));
    S.sets = r.sets.filter(s => !delPending.has(s.setId)).map(s => ({ setId: s.setId, date: s.date, split: s.split, exercise: s.exercise, setNo: +s.setNo, weight: s.weight, reps: s.reps }))
      .concat(addPending.filter(s => !serverIds.has(s.setId)));
    S.weekly = r.weekly || [];
    S.lastSync = Date.now(); UI.status = 'ok'; UI.error = ''; save();
    if (loud) toast('Connected to your Sheet');
    if (!(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName))) render(); else paintSync();
  } catch (err) {
    UI.status = 'err'; UI.error = err.message; paintSync();
    if (loud) { toast(err.message); render(); }
  }
}
window.addEventListener('online', () => { backoff = 2000; flush(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (UI.date !== todayStr() && UI.date === addDays(todayStr(), -1) && Date.now() - lastBoot > 3600000) UI.date = todayStr();
  if (Date.now() - lastBoot > 20000) bootstrap(false); else render();
});

/* ---------------- Toast ---------------- */
let toastT = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }

/* ---------------- Start ---------------- */
render();
bootstrap(false);
setInterval(() => { if (UI.view === 'today' && !document.querySelector('#sheet.on') && !(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName))) render(); }, 60000);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
